name: Publish to PyPI

# ============================================================
# Trusted Publishing (OIDC) — 无需 API token
# ============================================================
# 在 PyPI 项目页面配置 Trusted Publisher:
#   1. https://pypi.org/manage/project/pandax/settings/publishing/
#   2. Add a new pending publisher
#   3. 选择 "GitHub Actions"
#   4. Owner: pandax
#      Repository: pandax
#      Workflow: publish.yml
#      Environment: pypi
# ============================================================

on:
  push:
    tags:
      - "v*.*.*"  # 触发: v0.6.3, v1.0.0 等
  workflow_dispatch:
    inputs:
      target:
        description: "发布目标"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

env:
  PYTHON_VERSION: "3.10"

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build
        run: python -m build --no-isolation

      - name: Verify metadata
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run pytest
        run: pytest tests/ -v

  publish:
    name: Publish to ${{ github.event.inputs.target || 'PyPI' }}
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi  # 与 PyPI Trusted Publisher 配置一致
    permissions:
      id-token: write   # OIDC 必须
      contents: write   # 创建 GitHub Release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # PyPA 官方 action，自动用 Trusted Publishing
      - name: Publish to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
        # 不需要 password / token —— OIDC 自动认证

      # 手动触发时可选 TestPyPI
      - name: Publish to TestPyPI (manual trigger)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## What's Changed

            Auto-generated release notes from commits since last tag.

            ## Installation

            ```bash
            pip install --upgrade pandax
            ```

            See [CHANGELOG.md](https://github.com/pandax/pandax/blob/main/CHANGELOG.md) for details.