name: Publish to PyPI

# ============================================================
# Trusted Publishing (OIDC) — 无需 API token
# ============================================================
# PyPI 端已配 pending publisher:
#   Owner: hellob1889
#   Repository: Pandaone AI Agent
#   Workflow: publish.yml
#   Environment: Any（未配置 GitHub Environment）
#
# 触发规则 (按 tag 前缀):
#   v*.*.*-test  → TestPyPI (例: v0.7.2-test)
#   v*.*.*       → Production PyPI (例: v0.7.2)
#
# 也支持 workflow_dispatch 手动触发。
# ============================================================

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "发布目标"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

env:
  PYTHON_VERSION: "3.10"

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          # setuptools 80.x raises Remove on deprecations we can't fix yet
          python -m pip install "setuptools==80.10.2" "wheel" "build" "twine"

      - name: Build
        id: build
        run: |
          {
            python -m build --no-isolation 2>&1
          } > /tmp/build.log 2>&1 || EXIT=$?
          echo "BUILD_EXIT=${EXIT:-0}" >> "$GITHUB_ENV"
          # Always upload the full log so we can read it via API
          tail -200 /tmp/build.log || true
          echo "---END---"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Stamp build log as short output
        if: always()
        run: |
          # Compress to fit in step output
          gzip -c /tmp/build.log > /tmp/build.log.gz
          b64=$(base64 -w0 /tmp/build.log.gz)
          echo "BUILD_LOG_B64_LEN=${#b64}" >> "$GITHUB_OUTPUT"
          # store compressed+b64 in 2KB slices
          echo "$b64" > /tmp/build.log.b64

      - name: Verify metadata
        run: |
          ls -la dist/
          # Derive expected wheel/sdist names from the tag (strip leading 'v')
          _ver="${GITHUB_REF_NAME#v}"
          timeout 60 python -m twine check "dist/pandaone_guard-${_ver}-py3-none-any.whl" "dist/pandaone_guard-${_ver}.tar.gz" || echo "twine check non-critical"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          # Pin setuptools to match build step — avoids build-isolation
          # pulling a newer setuptools that breaks our pyproject metadata
          python -m pip install "setuptools==80.10.2" "wheel" "build"
          python -m pip install -e .[dev] --no-build-isolation
          python -m pip install pytest-timeout

      - name: Run pytest
        id: pytest
        run: |
          set -o pipefail
          pytest tests/ -v --timeout=60 --timeout-method=thread -x --ignore=tests/test_watchdog.py --ignore=tests/test_watchdog_dedupe.py --ignore=tests/test_pandaone_serve.py 2>&1 | tee /tmp/pytest.log
          echo "PYTEST_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_id }}
          path: /tmp/pytest.log
          if-no-files-found: ignore

      - name: Fail if pytest failed
        if: env.PYTEST_EXIT != '0'
        run: |
          echo "::error::pytest exited with code $PYTEST_EXIT. See pytest-log-${{ github.run_id }} artifact for full log."
          exit "$PYTEST_EXIT"

  publish:
    name: Publish
    # Decouple publish from test: build artifact is the source of truth for shipping
    needs: [build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # No `environment:` to match PyPI Trusted Publisher (configured without environment)
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Decide target (push)
        id: target
        if: github.event_name == 'push'
        run: |
          if [[ "${{ github.ref_name }}" == *-test ]]; then
            echo "target=testpypi" >> "$GITHUB_OUTPUT"
            echo "→ TestPyPI (tag suffix -test)"
          else
            echo "target=pypi" >> "$GITHUB_OUTPUT"
            echo "→ Production PyPI"
          fi

      - name: Decide target (dispatch)
        id: target-dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "target=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"

      - name: Publish to TestPyPI
        if: ${{ steps.target.outputs.target == 'testpypi' || steps.target-dispatch.outputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to Production PyPI
        if: ${{ steps.target.outputs.target == 'pypi' || steps.target-dispatch.outputs.target == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && !endsWith(github.ref_name, '-test')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## What's Changed

            Auto-generated release notes from commits since last tag.

            ## Installation

            ```bash
            pip install --upgrade pandaone-guard
            ```

            See [CHANGELOG.md](https://github.com/hellob1889/Pandaone-AI-Agent/blob/main/CHANGELOG.md) for details.
