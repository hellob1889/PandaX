name: PandaX CI

# Phase 7 — GitHub Actions 集成
#
# 触发条件：
#   - PR 打开/同步/重新打开
#   - push 到 main
# 作用：
#   - 安装 pandax
#   - 跑 pandax ci 验证所有变更都有审计
#   - 失败则不合并

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - "**/*.py"
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.sh"
      - "**/*.png"
      - "**/*.pdf"
      - "**/*.docx"
      - "**/*.xlsx"
      # CI 脚手架改动不触发审计（这些文件本身就是审计机制的载体）
      - "!.github/workflows/**"
      - "!.trae-html-share-packages/**"
  push:
    branches: [main, master]
    # push 触发是给任意 commit 用的（包括 workflow 文件改动），
    # 所以跳过机制放在 step 里通过 [skip-audit] 提交消息控制。

# 取消重复运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: PandaX 审计验证
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要 git 历史做 diff

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装 pandax-guard
        run: |
          pip install --upgrade pip
          pip install pandax-guard

      - name: 探测/安装 git
        run: |
          git --version || (echo "Git 缺失，请先安装" && exit 1)

      - name: 运行 pandax ci 验证
        id: ci
        run: |
          # ----- [skip-audit] 跳过机制 -----
          # 如果最近 5 条 commit message 里包含 [skip-audit]，跳过本次审计。
          # 适用场景：
          #   - 发布型 commit（已发版的代码不需要重新审计）
          #   - workflow / CI 脚手架改动（这些文件本身就是审计机制的载体）
          #   - README/docs-only 改动（不影响代码审计合规）
          RECENT_MSGS=$(git log -5 --pretty=format:'%s' 2>/dev/null || true)
          if echo "$RECENT_MSGS" | grep -q '\[skip-audit\]'; then
            echo "::notice::检测到 [skip-audit] 标记，跳过 pandax ci 验证"
            echo "最近 5 条 commit messages："
            echo "$RECENT_MSGS" | sed 's/^/  - /'
            exit 0
          fi
          # ----- 正常审计流程 -----
          BASE="origin/main"
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE="origin/master"
          fi
          echo "基线分支: $BASE"
          pandax ci --root . --base "$BASE"

      - name: 失败时输出审计日志摘要
        if: failure()
        run: |
          echo "::group::审计日志（最近 10 条）"
          if [ -f .pandax/pandax.jsonl ]; then
            tail -10 .pandax/pandax.jsonl
          else
            echo ".pandax/pandax.jsonl 不存在"
          fi
          echo "::endgroup::"
          echo "::group::二进制快照"
          if [ -f .pandax/binary_snapshots.json ]; then
            cat .pandax/binary_snapshots.json | head -30
          else
            echo ".pandax/binary_snapshots.json 不存在"
          fi
          echo "::endgroup::"

      - name: PR 评论（失败时）
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## ❌ PandaX CI 验证失败\n\n';
            body += 'PR 中检测到 **未通过 pandax write 审计**的变更。\n\n';
            body += '### 修复方法\n\n';
            body += '对每个被标记的文件，在本地执行：\n\n';
            body += '```bash\n';
            body += 'pandax write --root . \\\n';
            body += '  --file <文件路径> \\\n';
            body += '  --reason "<改动原因>" \\\n';
            body += '  --problem "<解决的具体问题>" \\\n';
            body += '  --approach "<采用的方法>" \\\n';
            body += '  --old "<原内容>" --new "<新内容>"\n';
            body += '```\n\n';
            body += '详细说明请查看 README。\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });