name: Pandaone AI Agent CI

# Phase 7 — GitHub Actions 集成
#
# 触发条件：
#   - PR 打开/同步/重新打开
#   - push 到 main
# 作用：
#   - 装当前分支的 pandaone（pip install -e .）
#   - 跑 pandaone ci 验证所有变更都有审计
#   - 失败则不合并
#
# v0.7.5 变更（PR #18 + #19）：
#   - [skip-audit] 扫描范围从 commit subject (`%s`) 扩展到 subject+body (`%s%n%n%b`)
#   - 新增"docs-only / meta-only" 自动跳过路径
#
# v0.7.7 变更（PR #26 / BUG-04a）：
#   - 切到 `pip install -e .`：装当前分支的 pandaone，确保 CI 验证的是 PR 修改后的代码
#   - 切到 `pandaone ci`：与 PR #4 模块重命名保持一致；之前 audit.yml 仍调用旧 CLI
#     `pandax ci` + 安装旧包 `pandax-guard`，导致 L7 防线一直是"绿色假阳性"

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - "**/*.py"
      - "**/*.md"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.sh"
      - "**/*.png"
      - "**/*.pdf"
      - "**/*.docx"
      - "**/*.xlsx"
      - "!.github/workflows/**"
      - "!.trae-html-share-packages/**"
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Pandaone 审计验证
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装 pandaone（当前分支）
        run: |
          pip install --upgrade pip
          # v0.7.7（BUG-04a 修复）：装当前分支而不是固定版本。
          pip install -e .

      - name: 探测/安装 git
        run: |
          git --version || (echo "Git 缺失，请先安装" && exit 1)

      - name: 运行 pandaone ci 验证
        id: ci
        run: |
          RECENT_MSGS=$(git log -5 --pretty=format:'%s%n%n%b' 2>/dev/null || true)
          if echo "$RECENT_MSGS" | grep -q '\[skip-audit\]'; then
            echo "::notice::检测到 [skip-audit] 标记（subject 或 body），跳过 pandaone ci 验证"
            exit 0
          fi
          WORKFLOW_ONLY=$(git diff --name-only HEAD~1 HEAD 2>/dev/null \
            | grep -v -E '^\.github/workflows/' \
            | grep -v -E '^\.trae-html-share-packages/' \
            | wc -l)
          if [ "$WORKFLOW_ONLY" = "0" ]; then
            echo "::notice::本次 push 仅改动 .github/workflows/，跳过 pandaone ci 验证"
            exit 0
          fi
          DOCS_ONLY=$(git diff --name-only HEAD~1 HEAD 2>/dev/null \
            | grep -v -E '^(CHANGELOG\.md|README[^/]*\.md|docs/.*|\.github/PULL_REQUEST_TEMPLATE(\.md|/.*)|\.github/ISSUE_TEMPLATE/.*|\.github/CODEOWNERS|\.github/CODE_OF_CONDUCT\.md|\.github/CONTRIBUTING\.md|\.github/SECURITY\.md|LICENSE[^/]*|NOTICE[^/]*)$' \
            | wc -l)
          if [ "$DOCS_ONLY" = "0" ]; then
            echo "::notice::本次 push 仅改动 docs / meta 文件，跳过 pandaone ci 验证"
            exit 0
          fi
          if [ -z "$(git diff --name-only HEAD~1 HEAD 2>/dev/null)" ]; then
            echo "::notice::HEAD~1..HEAD diff 为空，跳过 pandaone ci 验证"
            exit 0
          fi
          BASE="origin/main"
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            BASE="origin/master"
          fi
          echo "基线分支: $BASE"
          pandaone ci --root . --base "$BASE"

      - name: 失败时输出审计日志摘要
        if: failure()
        run: |
          echo "::group::审计日志（最近 10 条）"
          if [ -f .pandaone/pandaone.jsonl ]; then
            tail -10 .pandaone/pandaone.jsonl
          else
            echo ".pandaone/pandaone.jsonl 不存在"
          fi
          echo "::endgroup::"

      - name: PR 评论（失败时）
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            let body = '## Pandaone CI 验证失败\n\n';
            body += 'PR 中检测到 **未通过 pandaone write 审计**的变更。\n\n';
            body += '### 修复方法\n\n';
            body += '对每个被标记的文件，在本地执行：\n\n';
            body += '```bash\n';
            body += 'pandaone write --root . --file <文件路径> --reason "<理由>" --problem "<问题>" --approach "<方法>" --old "<原内容>" --new "<新内容>"\n';
            body += '```\n\n';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });