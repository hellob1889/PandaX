[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandax"
version = "0.7.1"
description = "AI Agent code audit gateway (PandaX) - OS-level mandatory review of every code change"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "PandaX Project", email = "pandax@example.com"},
]
requires-python = ">=3.8"
keywords = ["audit", "ai", "agent", "code-review", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "watchdog>=3.0.0",
    "openpyxl>=3.1.0",     # Excel export
    "python-docx>=1.1.0",  # Word export
    "reportlab>=4.0.0",    # PDF export
    "pyyaml>=6.0",         # YAML export
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.0",
]
download = [
    "urllib3>=1.26",  # for portable git download
]

[project.scripts]
pandax = "pandax:main"
pandax-guard = "pandax_guard:main"
pandax-mcp = "pandax_mcp:main"

[project.urls]
Homepage = "https://github.com/pandax/pandax"
Documentation = "https://github.com/pandax/pandax/blob/main/README.md"
Repository = "https://github.com/pandax/pandax"
Issues = "https://github.com/pandax/pandax/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pandax*", "pandax_guard*", "pandax_mcp*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
pandax = [
    "templates/*.sh",
    "templates/pre-commit-hook",
    "README.md",
    "banner.txt",
    "pandax_locked.ico",
    "pandax_unlocked.ico",
    "index.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"