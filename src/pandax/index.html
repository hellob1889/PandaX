<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PandaX 实时仪表盘</title>
<style>
:root {
  --bg: #fafaf9;
  --surface: #ffffff;
  --border: #e7e5e4;
  --text: #1c1917;
  --text-muted: #78716c;
  --primary: #4f46e5;
  --primary-soft: #eef2ff;
  --approved: #16a34a;
  --approved-soft: #dcfce7;
  --rejected: #dc2626;
  --rejected-soft: #fee2e2;
  --unauthorized: #d97706;
  --unauthorized-soft: #fef3c7;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 4px 12px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  --radius: 10px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  overflow-x: hidden;
}

/* 顶部 AppBar */
.appbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(255,255,255,.85);
  backdrop-filter: saturate(180%) blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
  font-size: 16px;
}
.brand .panda {
  width: 28px; height: 28px;
  background: var(--primary);
  border-radius: 8px;
  display: grid; place-items: center;
  color: white;
  font-size: 16px;
}
.brand .name { letter-spacing: -.01em; }
.brand .ver { color: var(--text-muted); font-weight: 400; font-size: 12px; margin-left: 4px; }

.appbar .spacer { flex: 1; }

.status {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
}
.status.connected {
  background: var(--approved-soft);
  color: var(--approved);
}
.status.disconnected {
  background: var(--rejected-soft);
  color: var(--rejected);
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50%     { opacity: .35; }
}

/* 统计栏 */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  padding: 16px 24px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
  box-shadow: var(--shadow-sm);
}
.stat .label { color: var(--text-muted); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
.stat .value { font-size: 28px; font-weight: 600; margin-top: 4px; letter-spacing: -.02em; }
.stat.approved .value { color: var(--approved); }
.stat.rejected .value { color: var(--rejected); }
.stat.unauthorized .value { color: var(--unauthorized); }

/* 主体布局 */
.main {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 16px;
  padding: 0 24px 24px;
}

/* 左侧过滤面板 */
.filters {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  height: fit-content;
  position: sticky;
  top: 80px;
  box-shadow: var(--shadow-sm);
}
.filters h3 {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 8px;
}
.filters .group { margin-bottom: 18px; }
.filter-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  user-select: none;
  transition: background .12s;
}
.filter-chip:hover { background: #f5f5f4; }
.filter-chip.active {
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 500;
}
.filter-chip .count {
  margin-left: auto;
  color: var(--text-muted);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.search input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  font-family: var(--font);
  background: var(--bg);
  outline: none;
  transition: border-color .12s, background .12s;
}
.search input:focus {
  border-color: var(--primary);
  background: white;
}

/* 卡片流 */
.feed {
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: calc(100vh - 280px);
  overflow-y: auto;
  padding-right: 6px;
}
.feed::-webkit-scrollbar { width: 6px; }
.feed::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 3px; }
.feed::-webkit-scrollbar-thumb:hover { background: #a8a29e; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
  transition: box-shadow .15s, transform .15s;
  animation: slide-in .35s ease-out;
}
.card:hover { box-shadow: var(--shadow); }
.card.fresh {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft), var(--shadow-sm);
}
@keyframes slide-in {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card .head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.card .status-badge {
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .03em;
}
.card .status-badge.approved {
  background: var(--approved-soft);
  color: var(--approved);
}
.card .status-badge.rejected {
  background: var(--rejected-soft);
  color: var(--rejected);
}
.card .status-badge.unauthorized {
  background: var(--unauthorized-soft);
  color: var(--unauthorized);
}
.card .status-badge.unknown {
  background: #f5f5f4;
  color: var(--text-muted);
}

.card .file {
  font-family: "SF Mono", "Cascadia Code", "Consolas", monospace;
  font-size: 13px;
  color: var(--text);
  font-weight: 500;
  word-break: break-all;
}
.card .time {
  margin-left: auto;
  color: var(--text-muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.card .reason {
  margin-top: 8px;
  padding: 8px 10px;
  background: #fafaf9;
  border-left: 3px solid var(--border);
  border-radius: 4px;
  font-size: 13px;
  color: var(--text);
}
.card .reason .label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 600;
  letter-spacing: .05em;
  margin-right: 6px;
}
.card .meta {
  display: flex;
  gap: 14px;
  margin-top: 10px;
  color: var(--text-muted);
  font-size: 12px;
}
.card .meta span { display: inline-flex; align-items: center; gap: 4px; }
.card .meta code {
  background: #f5f5f4;
  padding: 1px 6px;
  border-radius: 3px;
  font-family: "SF Mono", monospace;
  font-size: 11px;
}

/* 空状态 */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty .emoji { font-size: 40px; margin-bottom: 12px; }
.empty .text { font-size: 14px; }

/* Toast */
.toast-stack {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 100;
  pointer-events: none;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  box-shadow: var(--shadow);
  font-size: 13px;
  max-width: 320px;
  pointer-events: auto;
  animation: toast-in .25s ease-out;
}
.toast.danger { border-left: 3px solid var(--rejected); }
.toast.success { border-left: 3px solid var(--approved); }
@keyframes toast-in {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: translateX(0); }
}
</style>
</head>
<body>

<!-- 顶部 AppBar -->
<div class="appbar">
  <div class="brand">
    <div class="panda">🐼</div>
    <div>
      <span class="name">PandaX</span>
      <span class="ver">v0.7.1</span>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="status disconnected" id="connStatus">
    <div class="dot"></div>
    <span id="connText">未连接</span>
  </div>
</div>

<!-- 统计栏 -->
<div class="stats">
  <div class="stat">
    <div class="label">总记录</div>
    <div class="value" id="statTotal">0</div>
  </div>
  <div class="stat approved">
    <div class="label">已批准</div>
    <div class="value" id="statApproved">0</div>
  </div>
  <div class="stat rejected">
    <div class="label">已拒绝</div>
    <div class="value" id="statRejected">0</div>
  </div>
  <div class="stat unauthorized">
    <div class="label">未授权</div>
    <div class="value" id="statUnauthorized">0</div>
  </div>
</div>

<!-- 主体 -->
<div class="main">
  <!-- 左侧过滤 -->
  <aside class="filters">
    <div class="group search">
      <h3>搜索</h3>
      <input type="text" id="searchInput" placeholder="文件 / 原因 / Agent...">
    </div>
    <div class="group">
      <h3>状态</h3>
      <div class="filter-chip active" data-status="all">
        <span>全部</span><span class="count" id="countAll">0</span>
      </div>
      <div class="filter-chip" data-status="APPROVED">
        <span>已批准</span><span class="count" id="countApproved">0</span>
      </div>
      <div class="filter-chip" data-status="REJECTED">
        <span>已拒绝</span><span class="count" id="countRejected">0</span>
      </div>
      <div class="filter-chip" data-status="UNAUTHORIZED">
        <span>未授权</span><span class="count" id="countUnauthorized">0</span>
      </div>
    </div>
  </aside>

  <!-- 卡片流 -->
  <main class="feed" id="feed">
    <div class="empty" id="emptyState">
      <div class="emoji">🐼</div>
      <div class="text">等待 AI Agent 的第一次写入...</div>
    </div>
  </main>
</div>

<!-- Toast 容器 -->
<div class="toast-stack" id="toastStack"></div>

<script>
// ============================================================
// PandaX 仪表盘 — 实时 SSE 客户端
// ============================================================

const $ = (sel) => document.querySelector(sel);
const feed = $("#feed");
const emptyState = $("#emptyState");
const searchInput = $("#searchInput");
const connStatus = $("#connStatus");
const connText = $("#connText");

let allRecords = [];        // 所有记录(从历史 + 实时)
let activeStatus = "all";   // 当前过滤状态
let searchQuery = "";       // 当前搜索关键字

// SSE 连接
let evtSource = null;
function connect() {
  evtSource = new EventSource("/api/events");

  evtSource.addEventListener("connected", (e) => {
    setConnStatus(true);
    const data = JSON.parse(e.data).data;
    console.log("SSE connected", data);
  });

  // 历史回放(audit_history = 全量,audit = 增量)
  evtSource.addEventListener("audit_history", (e) => {
    const rec = JSON.parse(e.data).data;
    addRecord(rec, /*fresh*/ false);
  });
  evtSource.addEventListener("audit", (e) => {
    const rec = JSON.parse(e.data).data;
    addRecord(rec, /*fresh*/ true);
    showToast(rec);
  });

  evtSource.onerror = () => setConnStatus(false);
  evtSource.onopen = () => setConnStatus(true);
}

function setConnStatus(connected) {
  if (connected) {
    connStatus.className = "status connected";
    connText.textContent = "已连接 · 实时推送";
  } else {
    connStatus.className = "status disconnected";
    connText.textContent = "已断开 · 自动重连中...";
  }
}

// 添加单条记录
function addRecord(rec, fresh) {
  allRecords.push(rec);
  // 不去重:历史 + 实时可能短暂重叠,但记录有 audit_id
  renderStats();
  renderFeed();
  if (fresh) {
    const el = document.querySelector(`[data-id="${cssEscape(rec.id)}"]`);
    if (el) {
      el.classList.add("fresh");
      setTimeout(() => el.classList.remove("fresh"), 2500);
    }
  }
}

function renderStats() {
  const stats = { total: allRecords.length, APPROVED: 0, REJECTED: 0, UNAUTHORIZED: 0 };
  for (const r of allRecords) {
    const s = r.status || "UNKNOWN";
    if (s in stats) stats[s]++;
  }
  $("#statTotal").textContent = stats.total;
  $("#statApproved").textContent = stats.APPROVED;
  $("#statRejected").textContent = stats.REJECTED;
  $("#statUnauthorized").textContent = stats.UNAUTHORIZED;
  $("#countAll").textContent = stats.total;
  $("#countApproved").textContent = stats.APPROVED;
  $("#countRejected").textContent = stats.REJECTED;
  $("#countUnauthorized").textContent = stats.UNAUTHORIZED;
}

// 过滤 + 渲染
function renderFeed() {
  const filtered = allRecords.filter((r) => {
    if (activeStatus !== "all" && r.status !== activeStatus) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const text = `${r.file || ""} ${r.reason || ""} ${r.problem || ""} ${r.approach || ""} ${r.agent || ""}`.toLowerCase();
      if (!text.includes(q)) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    feed.innerHTML = "";
    feed.appendChild(emptyState);
    emptyState.style.display = "block";
    if (allRecords.length === 0) {
      emptyState.querySelector(".text").textContent = "等待 AI Agent 的第一次写入...";
    } else {
      emptyState.querySelector(".text").textContent = "没有匹配的记录";
    }
    return;
  }
  emptyState.style.display = "none";

  // 最新在前
  const reversed = filtered.slice().reverse();
  feed.innerHTML = reversed.map(recordCard).join("");
}

// 单卡片 HTML
function recordCard(r) {
  const status = (r.status || "UNKNOWN").toLowerCase();
  const statusClass = ["approved", "rejected", "unauthorized"].includes(status) ? status : "unknown";
  const time = r.timestamp || "?";
  const file = r.file || "?";
  const reason = r.reason || r.problem || "(无原因)";
  const problem = r.problem || "";
  const approach = r.approach || "";
  const commit = r.commit || "";
  const agent = r.agent || "";

  return `
    <div class="card" data-id="${escapeHtml(r.id || "")}">
      <div class="head">
        <span class="status-badge ${statusClass}">${escapeHtml(r.status || "UNKNOWN")}</span>
        <span class="file">${escapeHtml(file)}</span>
        <span class="time">${escapeHtml(time)}</span>
      </div>
      <div class="reason">
        <span class="label">REASON</span>${escapeHtml(reason)}
      </div>
      <div class="meta">
        ${problem ? `<span><strong>问题:</strong> ${escapeHtml(problem)}</span>` : ""}
        ${approach ? `<span><strong>方法:</strong> ${escapeHtml(approach)}</span>` : ""}
        ${commit ? `<span><strong>commit:</strong> <code>${escapeHtml(commit)}</code></span>` : ""}
        ${agent ? `<span><strong>Agent:</strong> <code>${escapeHtml(agent)}</code></span>` : ""}
      </div>
    </div>
  `;
}

// 过滤 chip 点击
document.querySelectorAll(".filter-chip").forEach((chip) => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".filter-chip").forEach((c) => c.classList.remove("active"));
    chip.classList.add("active");
    activeStatus = chip.dataset.status;
    renderFeed();
  });
});

// 搜索
searchInput.addEventListener("input", (e) => {
  searchQuery = e.target.value.trim();
  renderFeed();
});

// Toast 通知(新事件 + REJECTED 时特别醒目)
function showToast(rec) {
  const isDanger = rec.status === "REJECTED" || rec.status === "UNAUTHORIZED";
  const toast = document.createElement("div");
  toast.className = `toast ${isDanger ? "danger" : "success"}`;
  toast.innerHTML = `
    <strong>${escapeHtml(rec.status || "?")}</strong> · ${escapeHtml(rec.file || "?")}
    <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">
      ${escapeHtml(rec.reason || rec.problem || "")}
    </div>
  `;
  document.getElementById("toastStack").appendChild(toast);
  setTimeout(() => toast.style.opacity = "0", 4500);
  setTimeout(() => toast.remove(), 5000);
}

// 工具函数
function escapeHtml(s) {
  if (typeof s !== "string") s = String(s);
  return s.replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function cssEscape(s) {
  return String(s).replace(/[^a-zA-Z0-9_-]/g, (c) => `\\${c}`);
}

// 启动
connect();
</script>
</body>
</html>
