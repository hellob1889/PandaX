<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <!-- Background gradient (modern dark theme) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Approved badge gradient (green) -->
    <linearGradient id="approved-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Step card gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Rejected badge gradient (red) -->
    <linearGradient id="rejected-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="800" fill="url(#bg)"/>

  <!-- Top header banner -->
  <rect x="0" y="0" width="1600" height="80" fill="#0f172a" opacity="0.6"/>
  <text x="40" y="50" font-size="24" fill="#94a3b8" font-weight="600">$</text>
  <text x="70" y="50" font-size="22" fill="#e2e8f0" font-weight="600">PandaX — Your Codebase Personal Manager</text>
  <text x="1480" y="50" font-size="20" fill="#64748b">v0.7.2</text>

  <!-- ===== STEP 1: pandax write ===== -->
  <g transform="translate(40, 120)">
    <!-- Card background -->
    <rect width="500" height="620" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1"/>

    <!-- Step number badge -->
    <circle cx="30" cy="30" r="14" fill="#3b82f6"/>
    <text x="30" y="36" font-size="16" fill="white" text-anchor="middle" font-weight="700">1</text>

    <!-- Step title -->
    <text x="60" y="36" font-size="20" fill="#e2e8f0" font-weight="700">pandax write</text>
    <text x="60" y="58" font-size="13" fill="#64748b">AI Agent reports to PandaX first</text>

    <!-- Terminal prompt -->
    <text x="30" y="100" font-size="13" fill="#10b981" font-weight="600">$</text>
    <text x="50" y="100" font-size="13" fill="#cbd5e1">pandax write --file src/payment.py \</text>

    <!-- Terminal command lines -->
    <text x="50" y="125" font-size="13" fill="#94a3b8">  --reason "Fix rounding" \</text>
    <text x="50" y="145" font-size="13" fill="#94a3b8">  --problem "Charge $50,001 on $50k bill" \</text>
    <text x="50" y="165" font-size="13" fill="#94a3b8">  --approach "Round before transfer"</text>

    <!-- Approval badge -->
    <rect x="30" y="200" width="440" height="180" rx="10" fill="url(#approved-bg)"/>
    <text x="50" y="235" font-size="14" fill="#d1fae5" font-weight="600" letter-spacing="2">✓ APPROVED</text>
    <text x="50" y="265" font-size="13" fill="#ecfdf5">File:     src/payment.py</text>
    <text x="50" y="287" font-size="13" fill="#ecfdf5">Agent:    Claude Code</text>
    <text x="50" y="309" font-size="13" fill="#ecfdf5">Reason:   "Fix rounding"</text>
    <text x="50" y="331" font-size="13" fill="#ecfdf5">Problem:  "Charge $50,001..."</text>
    <text x="50" y="353" font-size="13" fill="#ecfdf5">Commit:   a3f7b2c</text>

    <!-- Audit ID -->
    <text x="30" y="425" font-size="11" fill="#64748b">audit_id:</text>
    <text x="100" y="425" font-size="11" fill="#94a3b8">audit_a3f7b2c</text>
    <text x="30" y="445" font-size="11" fill="#64748b">signed_at:</text>
    <text x="100" y="445" font-size="11" fill="#94a3b8">2026-09-11 03:47:23 UTC</text>

    <!-- Footer status -->
    <rect x="30" y="500" width="440" height="90" rx="8" fill="#064e3b" opacity="0.6"/>
    <text x="50" y="530" font-size="13" fill="#6ee7b7" font-weight="600">✓ Write approved + signed</text>
    <text x="50" y="555" font-size="12" fill="#a7f3d0">File modified, git committed,</text>
    <text x="50" y="572" font-size="12" fill="#a7f3d0">audit log appended.</text>
  </g>

  <!-- Arrow between step 1 and 2 -->
  <g transform="translate(540, 430)">
    <path d="M 0 0 L 30 0 L 30 -8 L 50 4 L 30 16 L 30 8 L 0 8 Z" fill="#475569"/>
  </g>

  <!-- ===== STEP 2: pandax log ===== -->
  <g transform="translate(600, 120)">
    <rect width="500" height="620" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1"/>

    <circle cx="30" cy="30" r="14" fill="#8b5cf6"/>
    <text x="30" y="36" font-size="16" fill="white" text-anchor="middle" font-weight="700">2</text>

    <text x="60" y="36" font-size="20" fill="#e2e8f0" font-weight="700">pandax log</text>
    <text x="60" y="58" font-size="13" fill="#64748b">Query the audit ledger anytime</text>

    <!-- Terminal prompt -->
    <text x="30" y="100" font-size="13" fill="#10b981" font-weight="600">$</text>
    <text x="50" y="100" font-size="13" fill="#cbd5e1">pandax log --recent 5</text>

    <!-- Output table header -->
    <rect x="30" y="125" width="440" height="30" fill="#1e293b"/>
    <text x="45" y="146" font-size="12" fill="#94a3b8" font-weight="600">TIME</text>
    <text x="160" y="146" font-size="12" fill="#94a3b8" font-weight="600">STATUS</text>
    <text x="240" y="146" font-size="12" fill="#94a3b8" font-weight="600">AGENT</text>
    <text x="345" y="146" font-size="12" fill="#94a3b8" font-weight="600">FILE</text>

    <!-- Row 1 (APPROVED) -->
    <text x="45" y="172" font-size="11" fill="#cbd5e1">03:47:23</text>
    <rect x="160" y="160" width="65" height="18" rx="4" fill="#10b981"/>
    <text x="192" y="173" font-size="10" fill="white" text-anchor="middle" font-weight="700">APPROVED</text>
    <text x="240" y="172" font-size="11" fill="#cbd5e1">Claude</text>
    <text x="345" y="172" font-size="11" fill="#cbd5e1">payment.py</text>

    <!-- Row 2 (APPROVED) -->
    <text x="45" y="200" font-size="11" fill="#cbd5e1">03:42:01</text>
    <rect x="160" y="188" width="65" height="18" rx="4" fill="#10b981"/>
    <text x="192" y="201" font-size="10" fill="white" text-anchor="middle" font-weight="700">APPROVED</text>
    <text x="240" y="200" font-size="11" fill="#cbd5e1">Cursor</text>
    <text x="345" y="200" font-size="11" fill="#cbd5e1">auth.py</text>

    <!-- Row 3 (REJECTED) -->
    <text x="45" y="228" font-size="11" fill="#cbd5e1">03:38:15</text>
    <rect x="160" y="216" width="65" height="18" rx="4" fill="url(#rejected-bg)"/>
    <text x="192" y="229" font-size="10" fill="white" text-anchor="middle" font-weight="700">REJECTED</text>
    <text x="240" y="228" font-size="11" fill="#cbd5e1">Trae</text>
    <text x="345" y="228" font-size="11" fill="#cbd5e1">.env</text>

    <!-- Row 4 (UNAUTHORIZED) -->
    <text x="45" y="256" font-size="11" fill="#cbd5e1">03:30:00</text>
    <rect x="160" y="244" width="85" height="18" rx="4" fill="#f59e0b"/>
    <text x="202" y="257" font-size="9" fill="white" text-anchor="middle" font-weight="700">UNAUTHORIZED</text>
    <text x="260" y="256" font-size="11" fill="#cbd5e1">watchdog</text>
    <text x="345" y="256" font-size="11" fill="#cbd5e1">.env</text>

    <!-- Row 5 -->
    <text x="45" y="284" font-size="11" fill="#cbd5e1">02:15:47</text>
    <rect x="160" y="272" width="65" height="18" rx="4" fill="#10b981"/>
    <text x="192" y="285" font-size="10" fill="white" text-anchor="middle" font-weight="700">APPROVED</text>
    <text x="240" y="284" font-size="11" fill="#cbd5e1">Claude</text>
    <text x="345" y="284" font-size="11" fill="#cbd5e1">test.py</text>

    <!-- Summary stats -->
    <rect x="30" y="320" width="440" height="80" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="50" y="345" font-size="11" fill="#64748b">Summary (last 24h):</text>
    <text x="50" y="367" font-size="12" fill="#10b981" font-weight="600">3 APPROVED</text>
    <text x="180" y="367" font-size="12" fill="#ef4444" font-weight="600">1 REJECTED</text>
    <text x="320" y="367" font-size="12" fill="#f59e0b" font-weight="600">1 UNAUTHORIZED</text>
    <text x="50" y="388" font-size="11" fill="#94a3b8">All changes signed, audited, traceable.</text>

    <!-- Footer status -->
    <rect x="30" y="500" width="440" height="90" rx="8" fill="#1e3a8a" opacity="0.5"/>
    <text x="50" y="530" font-size="13" fill="#93c5fd" font-weight="600">📊 Audit ledger ready</text>
    <text x="50" y="555" font-size="12" fill="#bfdbfe">Export to Excel/PDF/SQLite.</text>
    <text x="50" y="572" font-size="12" fill="#bfdbfe">13 formats supported.</text>
  </g>

  <!-- Arrow between step 2 and 3 -->
  <g transform="translate(1100, 430)">
    <path d="M 0 0 L 30 0 L 30 -8 L 50 4 L 30 16 L 30 8 L 0 8 Z" fill="#475569"/>
  </g>

  <!-- ===== STEP 3: pandax ci ===== -->
  <g transform="translate(1160, 120)">
    <rect width="400" height="620" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1"/>

    <circle cx="30" cy="30" r="14" fill="#ec4899"/>
    <text x="30" y="36" font-size="16" fill="white" text-anchor="middle" font-weight="700">3</text>

    <text x="60" y="36" font-size="20" fill="#e2e8f0" font-weight="700">pandax ci</text>
    <text x="60" y="58" font-size="13" fill="#64748b">GitHub Actions safety net</text>

    <text x="30" y="100" font-size="13" fill="#10b981" font-weight="600">$</text>
    <text x="50" y="100" font-size="13" fill="#cbd5e1">pandax ci --base main</text>

    <!-- CI results card -->
    <rect x="30" y="125" width="340" height="220" rx="8" fill="#1e293b" stroke="#334155"/>

    <!-- Header -->
    <text x="50" y="155" font-size="13" fill="#94a3b8" font-weight="600">CI Audit Report</text>
    <text x="50" y="175" font-size="11" fill="#64748b">Base: main → HEAD</text>

    <!-- Status -->
    <circle cx="55" cy="210" r="8" fill="#10b981"/>
    <text x="75" y="214" font-size="12" fill="#e2e8f0" font-weight="600">All 12 changes audited</text>

    <circle cx="55" cy="240" r="8" fill="#10b981"/>
    <text x="75" y="244" font-size="12" fill="#e2e8f0">8 approved by manager</text>

    <circle cx="55" cy="270" r="8" fill="#ef4444"/>
    <text x="75" y="274" font-size="12" fill="#e2e8f0">1 unauthorized detected</text>

    <circle cx="55" cy="300" r="8" fill="#f59e0b"/>
    <text x="75" y="304" font-size="12" fill="#e2e8f0">3 require review</text>

    <!-- Status footer -->
    <text x="50" y="328" font-size="11" fill="#64748b">Violation: src/utils.py —</text>
    <text x="50" y="343" font-size="11" fill="#64748b">no APPROVED record found</text>

    <!-- GitHub Actions style status -->
    <rect x="30" y="370" width="340" height="60" rx="8" fill="url(#rejected-bg)"/>
    <text x="50" y="398" font-size="14" fill="white" font-weight="700">✗ CI FAILED</text>
    <text x="50" y="418" font-size="11" fill="#fee2e2">PR blocked until audit passed</text>

    <!-- Footer status -->
    <rect x="30" y="500" width="340" height="90" rx="8" fill="#831843" opacity="0.5"/>
    <text x="50" y="530" font-size="13" fill="#f9a8d4" font-weight="600">🛡️ Last line of defense</text>
    <text x="50" y="555" font-size="12" fill="#fbcfe8">Even --no-verify</text>
    <text x="50" y="572" font-size="12" fill="#fbcfe8">cannot bypass PandaX.</text>
  </g>

  <!-- Bottom tagline -->
  <text x="800" y="785" font-size="16" fill="#64748b" text-anchor="middle" font-weight="600">
    Every AI Agent — Claude, Cursor, Trae — operates under one auditable protocol. No exceptions. No bypass.
  </text>
</svg>