<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Pandaone Social Preview</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #0b1020;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, "Segoe UI", sans-serif;
    }
    .frame {
      width: 1280px; height: 640px;
      box-shadow: 0 30px 80px rgba(0,0,0,.6);
      border-radius: 8px;
      overflow: hidden;
    }
    object, img, svg {
      display: block;
      width: 1280px;
      height: 640px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <object id="svg" type="image/svg+xml" data="social-preview.svg"></object>
  </div>
</body>
</html>
